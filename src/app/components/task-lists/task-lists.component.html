<h3>Lista de tareas</h3>

<app-barra-filtro [active]="filter" (filterChange)="setFilter($event)" />

<ul class="task-list">
  @for (task of filteredTasks; track task.id) {
    <li>
      <app-task-item [task]="task" (toggled)="toggleTask($event)" />
    </li>
  }
</ul>

<app-targeta-element [completed]="completedCount" [total]="tasks.length" />
